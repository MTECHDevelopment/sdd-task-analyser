name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Acelera o fluxo contínuo salvando o cache das dependências

      - name: Exibir versão do Python
        run: python --version

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Executar testes
        # Gera o relatório XML nativo sem precisar de plugins externos
        run: python -m pytest --junitxml=pytest_results.xml

      - name: Adicionar resultados ao resumo do GitHub
        if: always()
        uses: test-summary/action@v2
        with:
          paths: "pytest_results.xml"
          show: "all"

      - name: Upload de resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest_results.xml
        
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: taskanalyzer:latest
          build-args: |
            PYTHON_VERSION=3.11
          load: true
      
      - name: Executar container Docker
        run: docker run --rm taskanalyzer
