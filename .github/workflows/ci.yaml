name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Acelera o fluxo contínuo salvando o cache das dependências

      - name: Exibir versão do Python
        run: python --version

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-md # pytest-md gera um resumo bonito em markdown

      - name: Executar testes
        # O parâmetro --md-report gera o relatório e o > salva no arquivo txt de forma limpa
        run: python -m pytest --md-report --md-report-color never > pytest_results.txt

      - name: Exibir resultados dos testes no terminal
        if: always()
        run: |
          echo "=== Resultados dos Testes ==="
          cat pytest_results.txt || echo "Nenhum resultado de teste encontrado."
        
      - name: Adicionar resultados ao resumo do GitHub
        if: always()
        run: |
          if [ -f pytest_results.txt ]; then
            cat pytest_results.txt >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload de resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4 # Atualizado para v4 (evita avisos de depreciação)
        with:
          name: pytest-results
          path: pytest_results.txt
        
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: taskanalyzer:latest
          build-args: |
            PYTHON_VERSION=3.11
          load: true
      
      - name: Executar container Docker
        run: docker run --rm taskanalyzer
