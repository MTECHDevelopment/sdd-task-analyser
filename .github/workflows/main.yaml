name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exibir versão do Python
        run: python --version

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest # Garante que o pytest está instalado

      - name: Executar testes
        run: python -m pytest -q

      - name: Exibir resultados dos testes
        if: always()
        run: |
          echo "Resultados dos testes:"
          cat pytest_results.txt || echo "Nenhum resultado de teste encontrado."
        
      - name: Upload de resultados dos testes
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pytest-results
        
      - name: Configurar imagem Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: taskanalyzer:latest
          build-args: |
            PYTHON_VERSION=3.11
          load: true
      
      - name: Executar container Docker
        run: docker run --rm taskanalyzer
