name: Phase 1 Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Phase 1 artifacts
        run: python tools/validate_phase1.py
