name: phase1-validation

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate-phase1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Phase 1 artifacts
        run: python tools/validate_phase1.py
